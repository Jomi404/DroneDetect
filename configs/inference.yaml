model:
  weights_path: "../weights/best.pt"
  version: "1.0.0"
  architecture: "YOLOv8n"
  input_size: 1280
  classes:
    - pedestrian
    - car
    - truck

inference:
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: "cpu"

service:
  host: "0.0.0.0"
  port: 8000
  max_upload_size_mb: 20
  history_db: "data/history.db"
  results_dir: "data/results"
